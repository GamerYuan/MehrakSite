name: Build and Test

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --ignore-scripts --audit-level=low
      - name: Audit production dependencies
        run: npm audit --ignore-scripts --omit=dev --audit-level=low
      - run: npm run check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
